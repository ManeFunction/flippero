; UART <-> BLE bridge for the Fichero Flipper app.
; Default target: Seeed XIAO ESP32-C3 (cheap, BLE 5, 3V3 logic like the Flipper).
; Any ESP32 with Bluetooth works; the Flipper's Wi-Fi dev board (ESP32-S2) does not.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^1.4.3

[env:xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_UART_RX=20   ; D7
    -DPIN_UART_TX=21   ; D6

[env:esp32dev]
board = esp32dev
build_flags =
    -DPIN_UART_RX=16
    -DPIN_UART_TX=17

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_UART_RX=44
    -DPIN_UART_TX=43
